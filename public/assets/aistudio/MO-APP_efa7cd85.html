const uid=()=>globalThis.crypto.randomUUID();
const clone=value=>structuredClone(value);
const keyOf=(classId,timeSlotId)=>`${classId}::${timeSlotId}`;
function effectiveTeacher(cell,state){
  return cell.teacherId||'';
}
function findConflicts(state,cells=state.timetableCells){
  const groups=new Map();
  for(const cell of cells){
    if(!cell.teacherId)continue;
    const key=keyOf(cell.teacherId,cell.timeSlotId);
    groups.set(key,[...(groups.get(key)||[]),cell]);
  }
  return [...groups.values()].filter(group=>new Set(group.map(c=>c.classId)).size>1);
}
function putCell(state,cell,{allowConflict=false}={}){
  if(!state.classes.some(c=>c.id===cell.classId)||!state.timeSlots.some(s=>s.id===cell.timeSlotId)||!state.subjects.some(s=>s.id===cell.subjectId))throw Error('Lớp, môn hoặc tiết học không hợp lệ.');
  if(cell.teacherId&&!state.teachers.some(t=>t.id===cell.teacherId))throw Error('Giáo viên không tồn tại.');
  const previous=state.timetableCells.find(c=>keyOf(c.classId,c.timeSlotId)===keyOf(cell.classId,cell.timeSlotId));
  if(previous?.locked)throw Error('Ô này đang khóa. Hãy mở khóa trước khi sửa.');
  const next=state.timetableCells.filter(c=>keyOf(c.classId,c.timeSlotId)!==keyOf(cell.classId,cell.timeSlotId));
  if(!allowConflict&&cell.teacherId&&next.some(c=>c.teacherId===cell.teacherId&&c.timeSlotId===cell.timeSlotId))throw Error('Giáo viên đã có lịch tại lớp khác trong tiết này.');
  return {...state,timetableCells:[...next,{id:previous?.id||uid(),...cell}]};
}
function deleteCell(state,classId,timeSlotId){
  const existing=state.timetableCells.find(c=>c.classId===classId&&c.timeSlotId===timeSlotId);
  if(existing?.locked)throw Error('Ô này đang khóa. Hãy mở khóa trước khi xóa.');
  return {...state,timetableCells:state.timetableCells.filter(c=>c!==existing)};
}
function deleteEntity(state,kind,id){

const arrays=['classes','subjects','teachers','timeSlots','timetableCells'];
function validateState(state){
  if(!state||typeof state!=='object')throw Error('Dữ liệu không hợp lệ.');
  if(!state.school||typeof state.school.name!=='string'||typeof state.school.year!=='string'||typeof state.school.term!=='string')throw Error('Thiếu thông tin trường/năm học/học kỳ.');
  for(const kind of arrays){
    if(!Array.isArray(state[kind]))throw Error(`Thiếu danh sách ${kind}.`);
    const ids=new Set();
    for(const item of state[kind]){
      if(!item||typeof item.id!=='string'||!item.id||ids.has(item.id))throw Error(`ID trống hoặc trùng trong ${kind}.`);
      ids.add(item.id);
    }
  }
  for(const c of state.classes)if(typeof c.code!=='string'||typeof c.name!=='string'||!Number.isInteger(c.grade)||c.grade<1||c.grade>12)throw Error('Thông tin lớp không hợp lệ.');
  for(const t of state.teachers)if(typeof t.fullName!=='string'||typeof t.code!=='string')throw Error('Thông tin giáo viên không hợp lệ.');
  for(const s of state.subjects)if(typeof s.name!=='string'||typeof s.code!=='string'||!/^#[0-9a-f]{6}$/i.test(s.color))throw Error('Thông tin môn học không hợp lệ.');
  const slots=new Set();
  for(const s of state.timeSlots){
    const key=`${s.dayOfWeek}:${s.session}:${s.period}`;
    if(slots.has(key)||![2,3,4,5,6].includes(s.dayOfWeek)||!['MORNING','AFTERNOON'].includes(s.session)||!Number.isInteger(s.period)||s.period<1||s.period>(s.session==='MORNING'?5:4)||!/^\d{2}:\d{2}$/.test(s.startTime)||!/^\d{2}:\d{2}$/.test(s.endTime))throw Error('Khung tiết học không hợp lệ hoặc trùng.');
    slots.add(key);
  }
  if(state.timeSlots.length!==45)throw Error('Ma trận cần đủ 45 tiết: thứ Hai–thứ Sáu, 5 tiết sáng và 4 tiết chiều.');
  const occupied=new Set();
  for(const c of state.timetableCells){
    const key=keyOf(c.classId,c.timeSlotId);
    if(occupied.has(key))throw Error('Có nhiều tiết học trong cùng một ô.');
    occupied.add(key);
    if(!state.classes.some(x=>x.id===c.classId)||!state.subjects.some(x=>x.id===c.subjectId)||!state.timeSlots.some(x=>x.id===c.timeSlotId)||(c.teacherId&&!state.teachers.some(x=>x.id===c.teacherId)))throw Error('Có ô lịch tham chiếu danh mục không tồn tại.');
    if(c.teacherId!==undefined&&typeof c.teacherId!=='string')throw Error('Mã giáo viên không hợp lệ.');
    if(c.note!==undefined&&typeof c.note!=='string')throw Error('Ghi chú không hợp lệ.');
  }
  if(!Array.isArray(state.versions))throw Error('Danh sách phiên bản không hợp lệ.');
  return state;
}
function validateSnapshot(snapshot){
  if(!snapshot||typeof snapshot.id!=='string'||typeof snapshot.name!=='string'||!snapshot.data)throw Error('Phiên bản lưu không hợp lệ.');
  if(typeof snapshot.createdAt!=='string'||!Number.isFinite(Date.parse(snapshot.createdAt)))throw Error('Ngày lưu phiên bản không hợp lệ.');
  validateState({...snapshot.data,versions:[],published:null});return snapshot;
}
function parseBackup(raw,seed){
  const data=typeof raw==='string'?JSON.parse(raw):clone(raw);
  const old=data.academicYear!==undefined;
  let state;
  if(old){
    state={schemaVersion:1,school:{name:data.academicYear?.schoolName||'Trường THCS & THPT',year:data.academicYear?.name||'2026–2027',term:data.academicYear?.currentTerm||'HK1',appliedDate:''},classes:data.classes,subjects:data.subjects?.map(s=>({id:s.id,code:s.code,name:s.name,color:/^#[0-9a-f]{6}$/i.test(s.displayColor)?s.displayColor:'#d9e7f6'})),teachers:data.teachers?.map(t=>({id:t.id,code:t.code,fullName:t.fullName})),timeSlots:data.timeSlots||clone(seed.timeSlots),timetableCells:(data.timetableCells||[]).map(c=>({id:c.id||uid(),classId:c.classId,subjectId:c.subjectId,teacherId:c.teacherId||'',timeSlotId:c.timeSlotId,locked:!!c.locked,note:c.note||''})),versions:[],published:null};
  }else{
    if(data.schemaVersion!==1)throw Error('Phiên bản tệp sao lưu chưa được hỗ trợ.');
    state=data;
    for(const version of state.versions||[])validateSnapshot(version);
    if(state.published){
      validateSnapshot(state.published);
      if(typeof state.published.publishedAt!=='string'||!Number.isFinite(Date.parse(state.published.publishedAt)))throw Error('Ngày chốt lịch không hợp lệ.');
    }
  }
  return validateState(state);
}
function exportCsv(state){
  const safe=value=>{let text=String(value??'');if(/^[=+@\-\t\r]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';};
  const rows=[['Thứ','Buổi','Tiết','Thời gian',...state.classes.map(c=>c.name)]];
  for(const slot of state.timeSlots){
    rows.push([`Thứ ${slot.dayOfWeek}`,slot.session==='MORNING'?'Sáng':'Chiều',slot.period,`${slot.startTime}-${slot.endTime}`,...state.classes.map(cls=>{
      const c=state.timetableCells.find(c=>c.classId===cls.id&&c.timeSlotId===slot.id);
      return c?`${state.subjects.find(s=>s.id===c.subjectId)?.name||''}${c.teacherId?' — '+(state.teachers.find(t=>t.id===c.teacherId)?.fullName||''):''}`:'';
    })]);
  }
  return '\uFEFF'+rows.map(r=>r.map(safe).join(',')).join('\r\n');
}

function conflictPage(){
  const groups=findConflicts(state);
  return `<section class="card"><div class="card-title"><h2>${groups.length?'Cần kiểm tra '+groups.length+' khung giờ':'Không có lịch trùng giáo viên'}</h2><button data-action="go-matrix">Mở ma trận</button></div><p class="muted">Kiểm tra giáo viên dạy nhiều lớp trong cùng một tiết. Các ô chưa chọn giáo viên chưa thể kiểm tra trùng.</p>${groups.map(group=>{const slot=state.timeSlots.find(s=>s.id===group[0].timeSlotId);return `<div class="conflict-row"><span class="warning-icon">!</span><div><strong>${esc(nameOfTeacher(group[0].teacherId))}</strong><p>Thứ ${slot.dayOfWeek} · ${slot.session==='MORNING'?'Sáng':'Chiều'} tiết ${slot.period} · ${esc(slot.startTime)}</p></div><div class="conflict-links">${group.map(cell=>`<button data-cell-class="${esc(cell.classId)}" data-cell-slot="${esc(cell.timeSlotId)}">${esc(text(state.classes,cell.classId))} · ${esc(text(state.subjects,cell.subjectId))} ↗</button>`).join('')}</div></div>`;}).join('')}${!groups.length?'<div class="empty-state"><span class="success-icon">✓</span><h3>Lịch hiện tại không trùng giáo viên</h3><p>Tiếp tục chọn giáo viên cho các ô còn thiếu để kiểm tra đầy đủ.</p></div>':''}<div class="notice">${state.timetableCells.filter(c=>!c.teacherId).length} ô đã có môn hoặc hoạt động nhưng chưa chọn giáo viên. Kiểm tra này chưa bao gồm phòng học, lịch bận và đủ tiết chương trình.</div></section>`;
}
function versionsPage(){
  return `<section class="card"><div class="card-title"><h2>Bản đã chốt</h2><button class="primary" data-action="publish">Chốt bản đang xếp</button></div>${state.published?`<div class="published-card"><div><span class="live-pill published">✓ ĐÃ CHỐT</span><h3>${esc(state.published.name)}</h3><p>${esc(fmt(state.published.publishedAt))} · ${state.published.data.timetableCells.length} ô</p></div><div><button data-action="view-published">Xem ma trận</button><button data-action="restore-published">Khôi phục về bản đang xếp</button><button class="danger-link" data-action="unpublish">Gỡ bản đã chốt</button></div></div>`:'<p class="muted">Chưa có bản đã chốt. Sau khi kiểm tra lịch, chốt một bản để giữ độc lập với các chỉnh sửa tiếp theo.</p>'}</section><section class="card"><div class="card-title"><h2>Các phiên bản đã lưu</h2><button data-action="save-version">＋ Lưu phiên bản</button></div>${state.versions.length?state.versions.map(v=>`<div class="version-row"><div><strong>${esc(v.name)}</strong><p>${esc(fmt(v.createdAt))} · ${v.data.timetableCells.length} ô</p></div><button data-restore="${esc(v.id)}">Khôi phục</button><button data-remove-version="${esc(v.id)}" class="danger-link">Xóa</button></div>`).join(''):'<div class="empty-state"><span>▱</span><h3>Giữ lại một cột mốc</h3><p>Lưu một phiên bản trước mỗi đợt chỉnh sửa lớn.</p></div>'}</section>`;
}
function settings(){return `<div class="settings-grid"><section class="card"><h2>Thông tin nhà trường</h2><dl><dt>Trường</dt><dd>${esc(state.school.name)}</dd><dt>Năm học</dt><dd>${esc(state.school.year)}</dd><dt>Học kỳ</dt><dd>${esc(state.school.term)}</dd><dt>Áp dụng từ</dt><dd>${esc(state.school.appliedDate||'Chưa đặt')}</dd></dl><button data-action="school">Chỉnh sửa</button></section><section class="card"><h2>Sao lưu & chuyển dữ liệu</h2><p>Thay đổi được lưu trên trình duyệt của thiết bị này. Xuất bản sao lưu JSON để chuyển máy hoặc giữ dữ liệu an toàn.</p><div class="button-row"><button class="primary" data-action="backup">↓ Tải bản sao lưu JSON</button><button data-action="import">↑ Nhập JSON mới / app cũ</button><button data-action="csv">Xuất ma trận CSV</button><button data-action="recover">Lấy bản dự phòng gần nhất</button></div><p class="muted">Nhập từ app cũ: giữ lớp, môn, giáo viên, khung giờ và ô lịch; bỏ dữ liệu phân công và định mức. Dữ liệu thiếu tham chiếu sẽ được báo lỗi thay vì tự sửa.</p></section><section class="card"><h2>Khung ma trận gốc</h2><p>17 lớp ban đầu · Thứ Hai–thứ Sáu · 5 tiết sáng / 4 tiết chiều. Giữ các cột Thứ, Buổi, Tiết, Thời gian và giáo viên chủ nhiệm GV1 / GV2.</p><p class="muted">Giờ học và các hoạt động cố định được lấy từ mã nguồn cũ. Lịch đang vận hành trên Firebase cần nhập bằng bản sao lưu.</p></section><section class="card"><h2>Không gian mới</h2><p>Tạo một bản trống, giữ danh sách lớp, môn và giáo viên. Các ô đang khóa cũng sẽ được xóa.</p><button class="danger-link" data-action="clear">Xóa toàn bộ ô ở bản đang xếp</button><p class="muted">Bản đã chốt và các phiên bản đã lưu được giữ nguyên.</p></section></div>`;}
function openDialog(html){dialog.innerHTML=html;if(!dialog.open)dialog.showModal();}
const closeButton='<button type="button" data-action="close" class="icon-button" aria-label="Đóng">×</button>';
function cellEditor(classId,timeSlotId){
  if(showPublished){toast('Chuyển về bản đang xếp để chỉnh sửa.');return;}
  const cls=state.classes.find(c=>c.id===classId),slot=state.timeSlots.find(s=>s.id===timeSlotId);
  const cell=state.timetableCells.find(c=>c.classId===classId&&c.timeSlotId===timeSlotId);
  const locked=!!cell?.locked;
  openDialog(`<form id="cell-form" data-class="${esc(classId)}" data-slot="${esc(timeSlotId)}"><div class="dialog-title"><div><div class="eyebrow">CHỈNH Ô THỜI KHÓA BIỂU</div><h2>${esc(cls.name)}</h2><p>Thứ ${slot.dayOfWeek} · ${slot.session==='MORNING'?'Sáng':'Chiều'} tiết ${slot.period} · ${esc(slot.startTime)}–${esc(slot.endTime)}</p></div>${closeButton}</div>${locked?'<div class="notice">Ô đã khóa. Mở khóa để thay đổi môn, giáo viên hoặc xóa.</div>':''}<fieldset ${locked?'disabled':''}><label>Môn học<select name="subjectId" required>${selectOptions(state.subjects,cell?.subjectId,'name','Chọn môn học')}</select></label><label>Giáo viên<select name="teacherId">${selectOptions(state.teachers,cell?.teacherId,'fullName','Chưa chọn giáo viên')}</select></label><p class="field-help">Giáo viên đã có lịch cùng tiết sẽ được báo trước khi lưu.</p><label>Ghi chú<input name="note" maxlength="200" value="${esc(cell?.note||'')}" placeholder="Ví dụ: học phòng tin, học bù…"></label><label class="checkbox"><input type="checkbox" name="locked"> Khóa ô sau khi lưu</label></fieldset><div id="form-error" class="form-error" role="alert"></div><div class="dialog-actions">${cell?`<button type="button" data-action="toggle-lock" data-class="${esc(classId)}" data-slot="${esc(timeSlotId)}">${locked?'Mở khóa':'Khóa ô'}</button><button type="button" data-action="delete-cell" data-class="${esc(classId)}" data-slot="${esc(timeSlotId)}" class="danger-link" ${locked?'disabled':''}>Xóa ô</button>`:''}<button type="button" data-action="close">Hủy</button><button class="primary" type="submit" ${locked?'disabled':''}>Lưu ô lịch</button></div></form>`);
}
function entityEditor(kind,id){
  const item=state[kind].find(x=>x.id===id)||{};
  const labels={classes:'lớp',subjects:'môn',teachers:'giáo viên'};
  openDialog(`<form id="entity-form" data-kind="${kind}" data-id="${esc(id||'')}"><div class="dialog-title"><h2>${id?'Sửa':'Thêm'} ${labels[kind]}</h2>${closeButton}</div><label>Mã ${labels[kind]}<input name="code" maxlength="30" required value="${esc(item.code||'')}" placeholder="${kind==='teachers'?'GV01':kind==='classes'?'6A1':'TOAN'}"></label><label>${kind==='teachers'?'Họ tên giáo viên':'Tên hiển thị'}<input name="name" maxlength="100" required value="${esc(kind==='teachers'?item.fullName||'':item.name||'')}"></label>${kind==='classes'?`<label>Khối<select name="grade">${[6,7,8,9,10,11,12].map(g=>`<option value="${g}" ${item.grade===g?'selected':''}>Khối ${g}</option>`).join('')}</select></label><label>Giáo viên chủ nhiệm 1<select name="homeroomTeacherId">${selectOptions(state.teachers,item.homeroomTeacherId,'fullName','Chưa chọn')}</select></label><label>Giáo viên chủ nhiệm 2<select name="coHomeroomTeacherId">${selectOptions(state.teachers,item.coHomeroomTeacherId,'fullName','Chưa chọn')}</select></label>`:kind==='subjects'?`<label>Màu môn<input name="color" type="color" value="${esc(item.color||'#2563eb')}"></label>`:'<p class="field-help">Chỉ cần mã và họ tên. Chọn giáo viên trực tiếp khi xếp ô lịch.</p>'}<div id="form-error" class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" data-action="close">Hủy</button><button type="submit" class="primary">Lưu</button></div></form>`);
}
function schoolEditor(){openDialog(`<form id="school-form"><div class="dialog-title"><h2>Thông tin nhà trường</h2>${closeButton}</div>${[['name','Tên trường'],['year','Năm học'],['term','Học kỳ'],['appliedDate','Áp dụng từ']].map(([key,label])=>`<label>${label}<input name="${key}" value="${esc(state.school[key])}" ${key==='appliedDate'?'type="date"':'required maxlength="120"'}></label>`).join('')}<div id="form-error" class="form-error" role="alert"></div><div class="dialog-actions"><button type="button" data-action="close">Hủy</button><button class="primary">Lưu thông tin</button></div></form>`);}
function importFile(){
  const picker=document.createElement('input');picker.type='file';picker.accept='.json,application/json';
  picker.onchange=async()=>{
    const file=picker.files[0];if(!file)return;
    try{
      if(file.size>20*1024*1024)throw Error('Tệp vượt quá 20 MB.');
      const next=parseBackup(await file.text(),SEED);
      openDialog(`<div class="dialog-title"><h2>Kiểm tra dữ liệu trước khi nhập</h2>${closeButton}</div><p>Tệp: ${esc(file.name)}</p><div class="import-counts">${next.classes.length} lớp · ${next.subjects.length} môn · ${next.teachers.length} giáo viên · ${next.timetableCells.length} ô lịch</div><p>Thay thế dữ liệu đang dùng bằng tệp này. Bản hiện tại sẽ được tải xuống trước khi thay thế.</p><div class="dialog-actions"><button data-action="close">Hủy</button><button id="confirm-import" class="primary">Sao lưu & nhập dữ liệu</button></div>`);
      document.querySelector('#confirm-import').onclick=()=>{backup();if(commit(next,'Đã nhập dữ liệu.')){startupError='';showPublished=false;teacher='';grade='';dialog.close();render();}};
    }catch(error){toast('Không nhập: '+error.message);}
  };picker.click();
}
const actions={
  close:()=>dialog.close(),backup,school:schoolEditor,import:importFile,
  undo:()=>history('undo'),redo:()=>history('redo'),
  print:()=>window.print(),csv:()=>download('thoi-khoa-bieu.csv',exportCsv(displayed()),'text/csv;charset=utf-8'),
  density:()=>{compact=!compact;render();},
  fullscreen:async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{toast('Trình duyệt chưa cho phép toàn màn hình.');}},
  draft:()=>{showPublished=false;render();},published:()=>{showPublished=true;teacher='';render();},
  'go-matrix':()=>{view='matrix';showPublished=false;render();},
  'view-published':()=>{view='matrix';showPublished=true;teacher='';render();},
  'save-version':()=>{const name=prompt('Tên phiên bản:',`Bản lịch ${state.versions.length+1}`)?.trim();if(name)commit({...state,versions:[makeSnapshot(state,name.slice(0,100)),...state.versions]},'Đã lưu phiên bản độc lập.');},
  publish:()=>{try{if(confirm('Chốt bản đang xếp? Bản đã chốt hiện tại sẽ được thay thế.'))commit(publish(state),'Đã chốt lịch trên thiết bị này.');}catch(e){toast(e.message);}},
  unpublish:()=>{if(confirm('Gỡ bản đã chốt? Bản đang xếp và các phiên bản được giữ nguyên.')){if(commit({...state,published:null},'Đã gỡ bản đã chốt.'))showPublished=false;}},
  'restore-published':()=>{if(state.published&&confirm('Khôi phục cả danh mục và ô lịch từ bản đã chốt?'))commit(restoreSnapshot(state,state.published),'Đã khôi phục bản đã chốt.');},
  clear:()=>{if(confirm('Xóa TẤT CẢ ô ở bản đang xếp, gồm ô khóa? Hãy giữ bản sao lưu trước khi tiếp tục.')){backup();commit({...state,timetableCells:[]},'Đã tạo bản lịch trống.');}},
  recover:()=>{const raw=localStorage.getItem(KEY+'_previous');if(!raw){toast('Chưa có bản dự phòng.');return;}download('tkb-du-phong.json',raw);toast('Đã tải bản dự phòng. Dùng Nhập JSON để kiểm tra và khôi phục.');},
  'reload-external':()=>{if(pendingExternal){state=pendingExternal;pendingExternal=null;undo=[];redo=[];showPublished=false;saveTime=localStorage.getItem(KEY+'_savedAt');dialog.close();render();}},
  'toggle-lock':element=>{const {class:classId,slot:timeSlotId}=element.dataset;const next={...state,timetableCells:state.timetableCells.map(c=>c.classId===classId&&c.timeSlotId===timeSlotId?{...c,locked:!c.locked}:c)};if(commit(next)){cellEditor(classId,timeSlotId);}},
  'delete-cell':element=>{try{if(commit(deleteCell(state,element.dataset.class,element.dataset.slot),'Đã xóa ô lịch.'))dialog.close();}catch(e){toast(e.message);}}
};
document.addEventListener('click',event=>{
  const element=event.target.closest('button');if(!element)return;
  if(element.dataset.action){actions[element.dataset.action]?.(element);return;}
  if(element.dataset.view){view=element.dataset.view;showPublished=false;render();return;}
  if(element.hasAttribute('data-grade')){grade=element.dataset.grade;render();return;}
  if(element.dataset.cellClass){cellEditor(element.dataset.cellClass,element.dataset.cellSlot);return;}
  if(element.dataset.add){entityEditor(element.dataset.add);return;}
  if(element.dataset.edit){entityEditor(element.dataset.edit,element.dataset.id);return;}
  if(element.dataset.delete){try{const next=deleteEntity(state,element.dataset.delete,element.dataset.id);if(confirm('Xóa mục này khỏi danh mục?'))commit(next,'Đã xóa khỏi danh mục.');}catch(error){toast(error.message);}return;}
  if(element.dataset.restore){const version=state.versions.find(v=>v.id===element.dataset.restore);if(version&&confirm('Khôi phục danh mục và ma trận từ phiên bản này? Có thể hoàn tác ngay sau đó.'))commit(restoreSnapshot(state,version),'Đã khôi phục phiên bản.');return;}
  if(element.dataset.removeVersion&&confirm('Xóa phiên bản đã lưu này?'))commit({...state,versions:state.versions.filter(v=>v.id!==element.dataset.removeVersion)},'Đã xóa phiên bản.');
});
document.addEventListener('change',event=>{if(event.target.id==='teacher-filter'){teacher=event.target.value;render();}});
document.addEventListener('input',event=>{if(event.target.id==='search'){
  const start=event.target.selectionStart;query=event.target.value;const scroll=document.querySelector('.matrix-scroll');const x=scroll.scrollLeft,y=scroll.scrollTop;
  render();const input=document.querySelector('#search');input.focus();input.setSelectionRange(start,start);document.querySelector('.matrix-scroll').scrollTo(x,y);
}});
document.addEventListener('submit',event=>{
  event.preventDefault();const form=event.target,data=new FormData(form);let next;
  try{
    if(form.id==='cell-form')next=putCell(state,{classId:form.dataset.class,timeSlotId:form.dataset.slot,subjectId:data.get('subjectId'),teacherId:data.get('teacherId')||'',note:String(data.get('note')||'').trim(),locked:data.has('locked')});
    else if(form.id==='entity-form'){
      const kind=form.dataset.kind,id=form.dataset.id||uid(),code=String(data.get('code')).trim(),name=String(data.get('name')).trim();
      if(!code||!name)throw Error('Mã và tên không được để trống.');
      if(state[kind].some(item=>item.id!==id&&item.code.toLocaleLowerCase()===code.toLocaleLowerCase()))throw Error('Mã đã tồn tại trong danh mục.');
      const existing=state[kind].find(item=>item.id===id)||{};
      const item={...existing,id,code,...(kind==='teachers'?{fullName:name}:{name}),...(kind==='classes'?{grade:Number(data.get('grade')),homeroomTeacherId:data.get('homeroomTeacherId'),coHomeroomTeacherId:data.get('coHomeroomTeacherId')}:{}),...(kind==='subjects'?{color:data.get('color')}:{})};
      const list=form.dataset.id?state[kind].map(old=>old.id===id?item:old):[...state[kind],item];
      if(kind==='classes')list.sort((a,b)=>a.grade-b.grade||a.code.localeCompare(b.code,'vi',{numeric:true}));
      next={...state,[kind]:list};
    }else if(form.id==='school-form'){
      const school=Object.fromEntries([...data].map(([key,value])=>[key,String(value).trim()]));
      if(!school.name||!school.year||!school.term)throw Error('Vui lòng điền tên trường, năm học và học kỳ.');next={...state,school};
    }else return;
    if(commit(next))dialog.close();
  }catch(error){const output=form.querySelector('#form-error');if(output)output.textContent=error.message;else toast(error.message);}
});
window.addEventListener('storage',event=>{
  if(event.key!==KEY)return;
  if(!event.newValue){toast('Dữ liệu lưu ở tab khác đã bị xóa. Hãy sao lưu dữ liệu hiện tại.');return;}
  try{pendingExternal=parseBackup(event.newValue,SEED);render();toast('Có thay đổi ở tab khác. Hãy tải dữ liệu mới.');}catch{toast('Tab khác vừa ghi dữ liệu không hợp lệ. Bản đang dùng vẫn được giữ.');}
});
render();
</script>
</body>
</html>
